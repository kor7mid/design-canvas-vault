<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Icons Sidebar | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.si-sticky.si-sidebar {
			--width: 240px;
			--height: 54px;
			--icon-size: var(--height); /* 54px */
			--text-width: calc(var(--width) - var(--height)); /* 230px - 54px */
			width: var(--icon-size);
			height: auto;
		}

		.si-sticky.si-sidebar:not(.si-sticky-right) { left: 0; }

		.si-sticky.si-sidebar .social-icon {
			margin: 2px 0;
			margin-left: calc(-1 * var(--text-width));
			width: var(--width);
			height: var(--height);
			border: 0;
			border-radius: 0 4px 4px 0;
			display: inline-flex;
			align-items: center;
			transition: margin 0.2s ease-in-out;
		}

		.si-sticky.si-sidebar .social-icon i {
			position: absolute;
			left: auto;
			right: 0;
			width: var(--icon-size);
			height: var(--icon-size);
			line-height: var(--icon-size);
			text-align: center;
			transition: all 0.2s ease-in-out;
		}

		.si-sticky.si-sidebar .social-icon span {
			color: #FFF;
			font-size: 1rem;
			width: var(--text-width);
			text-align: center;
		}


		.si-sticky.si-sticky-right { right: 0; }

		.si-sticky.si-sidebar.si-sticky-right .social-icon {
			-ms-flex-direction: row-reverse;
			flex-direction: row-reverse;
			margin-left: 0;
			border-radius: 4px 0 0 4px;
		}

		.si-sticky.si-sidebar.si-sticky-right .social-icon i {
			left: 0;
			right: auto;
		}

		@media (min-width: 992px) {
			.si-sticky.si-sidebar:not(.si-sticky-right) .social-icon:hover { margin-left: 0; }
			.si-sticky.si-sidebar:not(.si-sticky-right) .social-icon:hover i { right: calc(-1 * var(--text-width)); }

			.si-sticky.si-sidebar.si-sticky-right .social-icon:hover { margin-left: calc(-1 * var(--text-width)); }
			.si-sticky.si-sidebar.si-sticky-right .social-icon:hover i { left: calc(-1 * var(--text-width)); }
		}
</style>
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap">
				<div class="container">

					<div class="si-sticky si-sidebar">
						<a href="#" class="social-icon text-white bg-facebook">
							<span>Share on Facebook</span>
							<i class="fa-brands fa-facebook-f"></i>
						</a>
						<a href="#" class="social-icon text-white bg-instagram">
							<span>Follow on Instagram</span>
							<i class="bi-instagram"></i>
						</a>
						<a href="#" class="social-icon text-white bg-youtube">
							<span>Subscribe on Youtube</span>
							<i class="fa-brands fa-youtube"></i>
						</a>
					</div>

					<div class="si-sticky si-sticky-right si-sidebar">
						<a href="#" class="social-icon text-white bg-x-twitter">
							<span>Follow on Twitter</span>
							<i class="fa-brands fa-x-twitter"></i>
						</a>
						<a href="#" class="social-icon text-white bg-pinterest">
							<span>Follow on Pinterest</span>
							<i class="fa-brands fa-pinterest-p"></i>
						</a>
						<a href="#" class="social-icon text-white bg-email3">
							<span>Email Us</span>
							<i class="fa-solid fa-envelope"></i>
						</a>
					</div>

				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
