		.curr-change-btn i {

			height: 44px;
			line-height: 40px;
			text-align: center;
			border-radius: 50%;
			margin-bottom: 10px;
			color: var(--cnvs-contrast-700);
			border: 2px solid var(--cnvs-line-color);
			transform: rotate(90deg);

		}

		.curr-change-btn .rotate-btn {

		.form-select {
