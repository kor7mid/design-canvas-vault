<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Cards | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap min-vh-100 d-flex align-items-center">
				<div class="container">

					<div class="row justify-content-center gutter-50 col-mb-50">

						<div class="col-xl-6 col-lg-8 text-center">
							<h3 class="h1 fw-bold mb-3">Product Card</h3>
						</div>

						<div class="clear"></div>

						<div class="product col-md-4 col-sm-6 text-center">
							<div class="grid-inner card border-0 h-shadow h-translatey-sm all-ts">
								<div class="product-image">
									<a href="#"><img src="../demos/store/images/product/4-1.jpg" alt="Product Image"></a>
									<a href="#"><img src="../demos/store/images/product/4-2.jpg" alt="Product Image"></a>
									<div class="sale-flash badge bg-dark p-2">New Stock</div>
									<div class="bg-overlay">
										<div class="bg-overlay-content align-items-end justify-content-between" data-hover-animate="fadeIn" data-hover-speed="400">
											<a href="#" class="btn btn-dark me-2" title="Add to Cart"><i class="bi-bag-plus"></i></a>
											<a href="include/ajax/shop-item.html" class="btn btn-dark" data-lightbox="ajax" title="Quick View"><i class="bi-eye"></i></a>
										</div>
										<div class="bg-overlay-bg bg-transparent"></div>
									</div>
								</div>
								<div class="product-desc">
									<div class="product-title"><h3><a href="#">Product Title 1</a></h3></div>
									<div class="product-price"><ins>$12.49</ins></div>
									<div class="product-rating mt-2">
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-half text-warning"></i>
									</div>
								</div>
							</div>
						</div>

						<div class="product col-md-4 col-sm-6 text-center">
							<div class="grid-inner card border-0 h-shadow h-translatey-sm all-ts">
								<div class="product-image">
									<a href="#"><img src="../demos/store/images/product/9-1.jpg" alt="Product Image"></a>
									<a href="#"><img src="../demos/store/images/product/9-2.jpg" alt="Product Image"></a>
									<div class="sale-flash badge bg-dark p-2">40% Off*</div>
									<div class="bg-overlay">
										<div class="bg-overlay-content align-items-end justify-content-between" data-hover-animate="fadeIn" data-hover-speed="400">
											<a href="#" class="btn btn-dark me-2" title="Add to Cart"><i class="bi-bag-plus"></i></a>
											<a href="include/ajax/shop-item.html" class="btn btn-dark" data-lightbox="ajax" title="Quick View"><i class="bi-eye"></i></a>
										</div>
										<div class="bg-overlay-bg bg-transparent"></div>
									</div>
								</div>
								<div class="product-desc">
									<div class="product-title"><h3><a href="#">Product Title 2</a></h3></div>
									<div class="product-price"><del>$24.99</del> <ins>$14.99</ins></div>
									<div class="product-rating mt-2">
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-fill text-warning"></i>
										<i class="bi-star-half text-warning"></i>
										<i class="bi-star text-warning"></i>
									</div>
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
