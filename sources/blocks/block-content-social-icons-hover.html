<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Icons Shadows | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.social-icon.inset-shadow {
			box-shadow: -11px -11px 25px rgba(255,255,255, 0.35),
                        11px 13px 25px rgba(165,181,208, 0.6);
		}

		.social-icon.inset-shadow:hover {
			transform: scale(1.1);
			box-shadow: -11px -11px 22px rgba(255,255,255, 0.52),
                            11px 13px 22px rgba(166,181,208,0.92),
                                inset -11px -11px 28px rgba(255,255,255, .7),
                                    inset 11px 11px 28px rgba(166,181,208, .85);
		}
</style>
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap py-0">

                <div class="row justify-content-center min-vh-100 align-content-center">
                    <div class="col-sm-5 d-flex justify-content-center">
                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2 color-facebook">
                            <i class="fa-brands fa-facebook-f"></i>
                            <i class="fa-brands fa-facebook-f color-facebook"></i>
                        </a>

                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2 color-twitter">
                            <i class="fa-brands fa-x-twitter"></i>
                            <i class="fa-brands fa-twitter color-twitter"></i>
                        </a>

                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2 color-paypal">
                            <i class="fa-brands fa-paypal"></i>
                            <i class="fa-brands fa-paypal color-paypal"></i>
                        </a>
                    </div>

                    <div class="col-sm-5 d-flex justify-content-center">
                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2">
                            <i class="fa-brands fa-facebook-f color-facebook m-0"></i>
                        </a>

                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2">
                            <i class="fa-brands fa-twitter color-twitter m-0"></i>
                        </a>

                        <a href="#" class="social-icon inset-shadow rounded-circle border-0 mx-2">
                            <i class="fa-brands fa-paypal color-paypal m-0"></i>
                        </a>
                    </div>

				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
