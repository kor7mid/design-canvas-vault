.blocks-card-10 .car-features i,

			width: 20px;

<body class="stretched">

		<section id="content">
			<div class="content-wrap bg-light py-0">
				<div class="container">

					<div class="row justify-content-center min-vh-100 align-items-center blocks-card-10">

						<!-- COl -->
						<div class="col-lg-4 col-md-6">
							<!-- Card -->
							<div class="card shadow-sm">
								<img src="../previews/preview/card-10/car.jpg" class="card-img-top" alt="...">
