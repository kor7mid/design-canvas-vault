<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup Recovery Email | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched ">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap py-0">

				<div class="d-flex align-items-center justify-content-center min-vh-100">
					<a href="#block-modal-recovery-email" data-lightbox="inline" class="button button-xlarge rounded-pill bg-primary text-transform-none ls-0 px-6 py-3">Recovery Email Notification</a>
				</div>

				<div class="modal-on-load" data-target="#block-modal-recovery-email"></div>

				<!-- Modal -->
				<div class="modal1 mfp-hide" id="block-modal-recovery-email">
					<div class="modal-dialog modal-dialog-centered">
						<div class="modal-content p-4 p-md-5 rounded text-center align-items-center shadow-lg border-0" style="background-color: #F1F1F1;">
							<img src="../previews/preview/popups/recovery-email.svg" alt="Svg" height="200" class="mb-5">
							<h3>Recovery Email Sent</h3>
							<p>Please, Check your email inbox. Progressively engage diverse partnerships whereas flexible materials.</p>

							<!-- Trigger -->
							<div>
								<a href="#" class="button button-rounded button-large bg-dark button-black ms-0">Send Again</a>
							</div>
						</div>
					</div>
				</div>

			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
