  <style>
.reveal-content img {
		display: block;
	}

	.reveal-content .reveal-content-hover {
		position: absolute;
		top: auto;
		display: block;
		left: 1rem;
		bottom: 0;
		padding: 1rem;
		background: rgba(255,255,255,0.95);
		margin-bottom: 1px;
		z-index: 2;
	}

	@media (min-width: 992px) {
		.reveal-content .reveal-content-hover {
			top: 0;
			bottom: auto;
			left: 0;
			display: none;
			margin-top: 1.5rem;
			margin-left: -1rem;
			border-radius: 3px;
		}
		.reveal-content img:hover + .reveal-content-hover,
		.reveal-content-hover:hover {
			display: block;
		}
	}
</style>
</head>
