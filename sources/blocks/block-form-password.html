<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show/Hide Password | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap">

				<div class="container">

					<div class="row justify-content-center">

						<div class="col-md-4">

							<form class="row mb-0">

								<div class="col-12 text-center">
									<h3>Show/Hide Password</h3>
								</div>

								<div class="col-12">
									<label for="form-password">Password:</label>
									<div class="input-group toggle-password">
										<input type="password" class="form-control" value="12345678">
										<button class="btn btn-outline-secondary bi-eye btn-password-toggle" type="button" style="border-color: #ced4da"></button>
									</div>
								</div>

								<div class="col-12 mt-5">
									<label for="form-password">Password:</label>
									<div class="input-group toggle-password" data-icon-off="bi-unlock" data-icon-on="bi-lock">
										<input type="password" class="form-control border-end-0" value="12345678">
										<button class="btn border-start-0 btn-outline-secondary bi-lock btn-password-toggle" type="button" style="border-color: #ced4da"></button>
									</div>
								</div>

							</form>

						</div>

					</div>

				</div>

			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
