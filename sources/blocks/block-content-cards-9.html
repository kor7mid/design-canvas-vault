<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards Kenburn | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.block-card-9 .grid-inner .btn-hover {
			opacity: 0;
			display: block;
			transition: opacity .3s ease, transform .3s .1s ease;
			margin-top: 15px;
			position: absolute;
			transform: translateY(0);
		}
		.block-card-9 .grid-inner:hover .btn-hover {
			opacity: 1;
			transform: translateY(-5px);
		}

		.block-card-9 .grid-inner .grid-image {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background-size: cover;
			background-position: center center;
		}

		.block-card-9 .grid-inner:hover .grid-image {
			-webkit-animation: kenburns 20s ease-out both;
	        animation: kenburns 20s ease-out both;
		}

		.block-card-9 .grid-inner .grid-icon,
		.block-card-9 .grid-inner .grid-content {
			transition: transform .3s ease;
		}

		.block-card-9 .grid-inner:hover .grid-content { transform: translateY(-45px); }
		.block-card-9 .grid-inner:hover .grid-icon { transform: translateY(-5px); }

		@-webkit-keyframes kenburns {
		  0% {
		    -webkit-transform: scale(1) translate(0, 0);
		            transform: scale(1) translate(0, 0);
		    -webkit-transform-origin: 84% 84%;
		            transform-origin: 84% 84%;
		  }
		  100% {
		    -webkit-transform: scale(1.25) translate(20px, 15px);
		            transform: scale(1.25) translate(20px, 15px);
		    -webkit-transform-origin: right bottom;
		            transform-origin: right bottom;
		  }
		}
		@keyframes kenburns {
		  0% {
		    -webkit-transform: scale(1) translate(0, 0);
		            transform: scale(1) translate(0, 0);
		    -webkit-transform-origin: 84% 84%;
		            transform-origin: 84% 84%;
		  }
		  100% {
		    -webkit-transform: scale(1.25) translate(20px, 15px);
		            transform: scale(1.25) translate(20px, 15px);
		    -webkit-transform-origin: right bottom;
		            transform-origin: right bottom;
		  }
		}
</style>
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap min-vh-100 d-flex align-items-center">
				<div class="container">

					<div class="row block-card-9 col-mb-50">

						<div class="col-lg-4 min-vh-75">
							<div class="grid-inner rounded-3 h-100">
								<div class="grid-image lazy" data-bg="../previews/preview/card-9/1.jpg"></div>
								<div class="bg-overlay">
									<div class="bg-overlay-content flex-column justify-content-between align-items-start p-5 dark">
										<div class="grid-icon">
											<img src="../demos/restaurant/images/icons/bowl-white.svg" alt="Image" width="60">
										</div>
										<div class="grid-content">
											<h5 class="text-uppercase fw-medium font-body ls-1 text-smaller op-07 mb-2">Organic &amp; Handmade</h5>
											<h3 class="fw-medium h2">Crafted Plates of Food</h3>
											<a href="#" class="icon-stacked rounded-circle bg-white text-danger text-center mb-0 btn-hover h5"><i class="bi-arrow-right"></i></a>
										</div>
									</div>
									<div class="bg-overlay-bg" style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, #b91523 100%);"></div>
								</div>
							</div>
						</div>
						<div class="col-lg-4 min-vh-75">
							<div class="grid-inner rounded-3 h-100">
								<div class="grid-image lazy" data-bg="../previews/preview/card-9/2.jpg"></div>
								<div class="bg-overlay">
									<div class="bg-overlay-content flex-column justify-content-between align-items-start p-5 dark">
										<div class="grid-icon">
											<img src="../demos/restaurant/images/icons/glass-white.svg" alt="Image" width="60">
										</div>
										<div class="grid-content">
											<h5 class="text-uppercase fw-medium font-body ls-1 text-smaller op-07 mb-2">Sustainable Agriculture</h5>
											<h3 class="fw-medium h2">Grown without Insecticides</h3>
											<a href="#" class="icon-stacked rounded-circle bg-white text-center mb-0 btn-hover h5" style="color: brown"><i class="bi-arrow-right"></i></a>
										</div>
									</div>
									<div class="bg-overlay-bg" style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, #604235 100%);"></div>
								</div>
							</div>
						</div>
						<div class="col-lg-4 min-vh-75">
							<div class="grid-inner rounded-3 h-100">
								<div class="grid-image lazy" data-bg="../previews/preview/card-9/3.jpg"></div>
								<div class="bg-overlay">
									<div class="bg-overlay-content flex-column justify-content-between align-items-start p-5 dark">
										<div class="grid-icon">
											<img src="../demos/restaurant/images/icons/spoon-white.svg" alt="Image" width="60">
										</div>
										<div class="grid-content">
											<h5 class="text-uppercase fw-medium font-body ls-1 text-smaller op-07 mb-2">Farmer's Markets</h5>
											<h3 class="fw-medium h2">Available Countrywide</h3>
											<a href="#" class="icon-stacked rounded-circle bg-white text-success text-center mb-0 btn-hover h5"><i class="bi-arrow-right"></i></a>
										</div>
									</div>
									<div class="bg-overlay-bg" style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, #497b37 100%);"></div>
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
