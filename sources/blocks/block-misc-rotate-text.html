<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotate Text On Scroll | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap bg-light overflow-visible scroll-detect">
				<div class="container">

					<div class="min-vh-25"></div>

					<h3>Rotate Circular Text On Scroll Effect</h3>

					<div class="circular-text position-fixed" style="min-width: 300px; max-height: 300px; top: 20px; right: 20px;">
						<div>
							<h4 class="rotated-text text-uppercase m-0 all-ts" style="--cnvs-transitions:.1s linear; transform:rotate(calc(3.6deg * var(--cnvs-scroll-percent)));">
								&nbsp;Corporate | Portfolio | Business | Real Estate | Medical | Construction |&nbsp;
							</h4>
							<h2 class="position-absolute top-50 start-50 translate-middle mb-0">Demos</h2>
						</div>
					</div>

					<div style="height: 1000px;"></div>

				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
