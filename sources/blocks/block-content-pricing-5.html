<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing 5 | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap">
				<div class="container">

					<h3 class="text-center mb-5">Pricing Table Select</h3>

					<div class="row justify-content-center">
						<div class="col-md-9">
							<table class="table">
								<thead class="thead-light">
									<tr>
										<th scope="col">Plan</th>
										<th scope="col">Speed</th>
										<th scope="col">Users</th>
										<th scope="col">Price</th>
										<th scope="col"></th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<td>Basic</td>
										<td>20MB/s</td>
										<td>100 Users</td>
										<td>$5</td>
										<td><input class="form-check-input" type="radio" name="price" id="paln-basic" value="Basic" checked></td>
									</tr>
									<tr>
										<td>Personal</td>
										<td>50MB/s</td>
										<td>200 Users</td>
										<td>$10</td>
										<td><input class="form-check-input" type="radio" name="price" id="paln-personal" value="Personal"></td>
									</tr>
									<tr>
										<td>Professional</td>
										<td>100MB/s</td>
										<td>500 Users</td>
										<td>$20</td>
										<td><input class="form-check-input" type="radio" name="price" id="paln-professional" value="Professional"></td>
									</tr>
									<tr>
										<td>Business</td>
										<td>200MB/s</td>
										<td>1000 Users</td>
										<td>$35</td>
										<td><input class="form-check-input" type="radio" name="price" id="paln-business" value="Business"></td>
									</tr>
									<tr class="border-bottom">
										<td>Enterprise</td>
										<td>300MB/s</td>
										<td>Unlimited</td>
										<td>$40</td>
										<td><input class="form-check-input" type="radio" name="price" id="paln-enterprise" value="Enterprise"></td>
									</tr>
								</tbody>
							</table>
							<div class="d-flex justify-content-end">
								<a href="#" class="btn btn-dark">Get Started <i class="bi-arrow-right"></i></a>
							</div>
						</div>
					</div>

				</div>
			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
