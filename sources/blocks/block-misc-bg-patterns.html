<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Backgrounds | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap py-0 bg-light">

				<div class="text-center my-6">
					<h3 class="display-4 fw-bold mb-3">12 SVG Backgrounds <i class="bi-arrow-down"></i></h3>
				</div>

				<!-- Shiny Background -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/shiny.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">1. Shiny Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Sprinkle Background -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/sprinkle.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">2. Sprinkle Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Meteor Background -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/meteor.svg') no-repeat center center; background-size: 100% auto;">
					<h1 class="display-3 z-6">3. Meteor Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Animated Shapes -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/animated_shape.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">4. Animated Shapes</h1>
				</div>

				<div class="clear"></div>

				<!-- Wave -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/wave.svg') no-repeat center center; background-size: 100%;">
					<h1 class="display-3 z-6">5. Waves Background</h1>
				</div>

				<div class="clear"></div>

				<!-- World Map -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/world_map.svg') no-repeat center center; background-size: 100% auto;">
					<h1 class="display-3 z-6">6. World Map</h1>
				</div>

				<div class="clear"></div>

				<!-- Polygon -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/polygon.svg') no-repeat center center; background-size: 100% auto;">
					<h1 class="display-3 z-6">7. Polygon Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Rect -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/rect.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">8. Rect Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Blob -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/blob.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">9. Blob Background</h1>
				</div>

				<div class="clear"></div>

				<!-- Colored -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/colored.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">10. Colored Shape</h1>
				</div>

				<div class="clear"></div>

				<!-- Colored Pattern -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: var(--bg_color, #0E2A47) url('../previews/preview/svg-bg/colored_patterns.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">11. Colored Pattern</h1>
				</div>

				<div class="clear"></div>

				<!-- Gradient Shine -->
				<div class="min-vh-100 d-flex align-items-center justify-content-center dark position-relative mt-2" style="background: url('../previews/preview/svg-bg/gradient.svg') no-repeat center center; background-size: cover;">
					<h1 class="display-3 z-6">12. Gradient Shine</h1>
				</div>

			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
