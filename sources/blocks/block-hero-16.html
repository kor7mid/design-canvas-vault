<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero 16 | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.svg-bg {
			position: absolute;
			top: 0;
			right: 0;
			z-index: 0;
		}
</style>
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Hero Section
		============================================= -->
		<section id="slider" class="slider-element">

			<img src="../previews/preview/hero-16.svg" class="svg-bg d-none d-lg-block" alt="">

			<div class="vertical-middle min-vh-lg-100">
				<div class="container py-5 py-lg-0">
					<div class="row align-items-center justify-content-between">
						<div class="col-lg-5">
							<h6 class="text-uppercase ls-4 fw-normal op-05">Before Headings</h6>
							<h1 class="display-4 fw-bold">Grow Your Online Business with Us.</h1>
							<p class="lead mb-5 op-06">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum assumenda magni obcaecati quo ratione deleniti aut sunt voluptatum, ab nulla.</p>
							<a href="#" class="btn btn-lg btn-dark">Learn More</a>
						</div>
						<div class="col-lg-5 mt-5 mt-lg-0">
							<div class="card border-0 p-4 rounded-4 shadow-lg">
								<div class="card-body">
									<h2 class="mb-1">Sign up to Canvas</h2>
									<p class="mb-0">Already have an Account? <a href="#">Log In</a></p>
									<hr class="my-4">
									<div class="d-flex">
										<a href="#" class="btn btn-dark h-op-09 flex-fill border-transparent px-3 bg-google"><i class="fa-brands fa-google"></i></a>
										<a href="#" class="btn btn-dark h-op-09 mx-2 flex-fill border-transparent px-3 bg-appstore"><i class="fa-brands fa-apple"></i></a>
										<a href="#" class="btn btn-dark h-op-09 flex-fill border-transparent px-3 bg-facebook"><i class="fa-brands fa-facebook-f"></i></a>
									</div>
									<form id="login-form" name="login-form" class="row mb-0 mt-4" action="#" method="post">

										<div class="col-12 form-group">
											<input type="text" id="register-form-name" name="register-form-name" autocomplete="off" value="" class="form-control" placeholder="Full Name">
										</div>

										<div class="col-12 form-group">
											<input type="email" id="register-form-email" name="register-form-email" autocomplete="off" value="" class="required email form-control" placeholder="Email Address">
										</div>

										<div class="col-12 form-group">
											<input type="password" id="register-form-password" name="register-form-password" autocomplete="new-password" value="" class="form-control" placeholder="Password">
										</div>

										<div class="col-12 form-group">
											<div class="form-check">
												<input class="form-check-input" type="checkbox" value="" id="register-form-check" name="register-form-check">
												<label class="form-check-label text-transform-none fw-normal font-body ls-0 text-black-50" for="register-form-check">
												    By creating account, you agree to accept our <a href="#">Privacy Policy</a>, <a href="#">Terms &amp; Condition</a> and <a href="#">Notfication Settings</a>.
												</label>
											</div>
											<!-- <p class="text-black-50 mb-0 text-smaller"></p> -->
										</div>

										<div class="col-12 mt-2">
											<button class="button button-dark bg-dark m-0 w-100 rounded" id="register-form-submit" name="register-form-submit" value="register">Register Now</button>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

		</section>

		<!-- Content
		============================================= -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
