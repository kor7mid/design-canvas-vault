<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup Ticket | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

  <style>
.entry-date > * {
			line-height: 1;
		}
</style>

<body class="stretched ">
  <div id="wrapper">
    <!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap py-0">

				<div class="d-flex align-items-center justify-content-center min-vh-100">
					<a href="#block-modal-ticket" data-lightbox="inline" class="button button-xlarge rounded-pill bg-danger text-transform-none ls-0 px-6 py-3">Book Event</a>
				</div>

				<!-- Modal -->
				<div class="modal1 mfp-hide" id="block-modal-ticket">
					<div class="modal-dialog modal-dialog-centered modal-lg">
						<div class="modal-content bg-white rounded">

							<div class="row m-0 g-0">
								<div class="col-12">
									<div class="fancy-title title-double-border title-center my-2 p-4">
										<h3 class="">Event Title</h3>
									</div>
								</div>
								<div class="col-12 bg-light">
									<iframe width="560" height="315" src="https://www.youtube.com/embed/lep7-tH15MY" frameborder="0" allow="accelerometer; autoplay; clipboard-write; controls:0; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
								</div>
								<div class="col-12">
									<div class="row justify-content-between align-items-center p-5 col-mb-30">
										<div class="col-lg-2">
											<div class="d-flex flex-column align-items-lg-center entry-date">
												<h3 class="mb-0 h1">10</h3>
												<h4 class="mb-0">Apr</h4>
											</div>
										</div>
										<div class="col">
											<h4 class="mb-2">18:30 Onwards</h4>
											<p class="mb-0 op-07">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nemo, assumenda molestias.</p>
										</div>
										<div class="col-lg-3">
											<a href="#" class="btn btn-lg btn-danger w-100">Book Ticket</a>
										</div>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>

			</div>
		</section><!-- #content end -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
