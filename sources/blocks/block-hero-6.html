<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero 6 | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.block-hero-6 .font-secondary {
			font-family: 'Grand Hotel', cursive;
		}

		.block-hero-6 {
			--color: 34,46,43;
		}

		.block-hero-6 .hero-img {
			border: 16px solid #FFF;
		}
</style>
</head>
<body class="stretched">
  <div id="wrapper">
    <!-- Hero Section
		============================================= -->
		<section id="slider" class="slider-element dark block-hero-6" style="background-image: repeating-linear-gradient(112.5deg, rgb(var(--color)) 0px, rgb(var(--color)) 20px,transparent 20px, transparent 22px),repeating-linear-gradient(22.5deg, rgb(var(--color)) 0px, rgb(var(--color)) 20px,transparent 20px, transparent 22px),linear-gradient(90deg, hsl(168deg 19% 32%),hsl(168deg 19% 32%));">
			<div class="bg-overlay z-1 d-md-block d-none" style="background: linear-gradient(to right, #FFF 0%, #FFF 25%, transparent 25%, transparent 100%)"></div>

			<div class="container z-2">
				<div class="row min-vh-100 align-items-center justify-content-sm-around py-5">
					<div class="col-md-6 order-md-last text-center">
						<i class="fa-solid fa-burger icon-5x"></i>
						<h2 class="display-1 text-white font-secondary">We Deliver your Taste.</h2>
						<p class="lead text-white-50">Lorem, ipsum dolor, sit amet consectetur adipisicing elit. Iure repellat animi praesentium sunt magni quia consectetur.</p>
						<a href="#" class="btn btn-light py-4 px-5 mt-3 rounded-0 text-uppercase fw-bold ls-2">Know More</a>
					</div>

					<div class="col-md-4 mt-5 mt-md-0">
						<img src="../previews/preview/hero-6.jpg" alt="image" class="hero-img">
					</div>
				</div>
			</div>

		</section>

		<!-- Content
		============================================= -->
  </div>
  <script src="../shared/js/jquery.js"></script>
  <script src="../shared/js/plugins.min.js"></script>
  <script src="../shared/js/functions.bundle.js"></script>
</body>
</html>
