<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <script>if(window.self===window.top&&location.pathname.endsWith(".html")){var id=location.pathname.split("/").pop().replace(/.html$/,"");var b=location.pathname.startsWith("/design-canvas-vault")?"/design-canvas-vault":"";location.replace(b+"/"+id);}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Icons Toggle | Design Canvas Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="../shared/css/font-icons.css">
  <link rel="stylesheet" href="../shared/css/swiper.css">
  <link rel="stylesheet" href="../shared/css/animate.css">
  
  <link rel="stylesheet" href="../shared/css/custom.css">
  <style>
.si-box {
			display: flex;
			display: -ms-flexbox;
		}

		.si-checkbox {
			position: relative;
			width: 40px; /* Social Icons Size */
			height: 40px; /* Social Icons Size */
			outline: none;
			background-color: #EEE;
			-webkit-appearance: none;
			cursor: pointer;
		}

		.si-checkbox::before {
			content: "\e9d1";
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-size: 1.25rem;
			font-family: "lined-icons";
		}

		.si-checkbox:checked::before { content: "\ea11"; }

		.social-menus {
			position: relative;
			display: flex;
			display: -ms-flexbox;
			overflow: hidden;
			width: 0;
			transition: width .2s, height .2s;
		}

		.si-checkbox:checked ~ .social-menus {
			width: 200px; /* Social Icons width x quantity (eg: 40x5) */
		}

		/* Vertical */
		.flex-column .social-menus {
			-ms-flex-direction: column;
			flex-direction: column;
			width: auto;
			height: 0;
		}

		.flex-column .si-checkbox:checked ~ .social-menus {
			height: 200px;/* Social Icons height x quantity (eg: 40x5) */
		}
</style>
</head>
<body class="stretched">

									</a>
									<a href="#" class="social-icon m-0 rounded-0 border-transparent text-white bg-x-twitter">

									</a>

									</a>

						<div class="col-md-6">

										<i class="fa-brands fa-facebook-f"></i>

									</a>
									<a href="#" class="social-icon m-0 rounded-0 border-transparent text-white bg-x-twitter">
										<i class="fa-brands fa-x-twitter"></i>
										<i class="fa-brands fa-x-twitter"></i>
